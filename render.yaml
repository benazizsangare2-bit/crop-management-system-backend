services:
  - type: web
    name: crop-management-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crop-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Auto-generate a secret key

# Define your database
databases:
  - name: cropinstance
    plan: free
    databaseName: cropmanagementdb # Optional: specify DB name
